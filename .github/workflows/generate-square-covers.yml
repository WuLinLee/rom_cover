name: Generate square cover set

on:
  push:
    branches: [main]
    paths:
      - "GBA/**"
      - "scripts/generate_square_covers.py"
      - ".github/workflows/generate-square-covers.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  square-covers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Create square covers
        run: python scripts/generate_square_covers.py
      - name: Commit square images
        run: |
          if git diff --quiet -- GBA_Square; then
            echo "Square cover set is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GBA_Square
          git commit -m "Add square-cropped GBA covers"
          git push
